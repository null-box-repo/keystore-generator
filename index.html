<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0f14" />
    <meta name="description" content="KeyStore Generator - Generate Java KeyStore files" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/toolbar.css" />
    <link rel="stylesheet" href="/css/form.css" />
    <link rel="stylesheet" href="/css/results.css" />
    <link rel="stylesheet" href="/css/dialog.css" />
    <title>KeyStore Generator</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <div class="brand-copy"><h1>KeyStore Generator</h1></div>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.7A8.7 8.7 0 0 1 9.3 3.5 8.7 8.7 0 1 0 20.5 14.7Z"></path></svg>
        </button>
      </header>

      <form id="keystore-form" class="ks-form" autocomplete="off">
        <fieldset class="ks-fieldset">
          <legend>KeyStore File</legend>

          <label class="ks-label" for="ks-file">Output filename</label>
          <input class="ks-input" type="text" id="ks-file" name="ksFile" placeholder="e.g. release.jks" required />

          <label class="ks-label" for="ks-path">Output directory</label>
          <input class="ks-input" type="text" id="ks-path" name="ksPath" value="/sdcard/Download" required />

          <label class="ks-label" for="ks-alias">Key alias</label>
          <input class="ks-input" type="text" id="ks-alias" name="ksAlias" placeholder="e.g. mykey" required />
        </fieldset>

        <fieldset class="ks-fieldset">
          <legend>Key Settings</legend>

          <label class="ks-label" for="ks-alg">Key algorithm</label>
          <select class="ks-input" id="ks-alg" name="ksAlg">
            <option value="RSA" selected>RSA</option>
            <option value="DSA">DSA</option>
            <option value="EC">EC</option>
          </select>

          <label class="ks-label" for="ks-size">Key size (bits)</label>
          <select class="ks-input" id="ks-size" name="ksSize">
            <option value="1024">1024</option>
            <option value="2048" selected>2048</option>
            <option value="4096">4096</option>
          </select>

          <label class="ks-label" for="ks-validity">Validity period (days)</label>
          <input class="ks-input" type="number" id="ks-validity" name="ksValidity" placeholder="e.g. 3650" min="1" max="36500" required />
        </fieldset>

        <fieldset class="ks-fieldset">
          <legend>Passwords</legend>

          <label class="ks-label" for="ks-storepass">KeyStore password</label>
          <input class="ks-input" type="text" id="ks-storepass" name="ksStorepass" placeholder="e.g. mypassword" required />

          <label class="ks-label" for="ks-keypass">Key password</label>
          <input class="ks-input" type="text" id="ks-keypass" name="ksKeypass" placeholder="e.g. mypassword" required />
        </fieldset>

        <fieldset class="ks-fieldset">
          <legend>Owner Information (Distinguished Name)</legend>

          <label class="ks-label" for="ks-cn">CN - Common Name</label>
          <input class="ks-input" type="text" id="ks-cn" name="ksCn" placeholder="e.g. My Project" />

          <label class="ks-label" for="ks-ou">OU - Organizational Unit</label>
          <input class="ks-input" type="text" id="ks-ou" name="ksOu" placeholder="e.g. Engineering" />

          <label class="ks-label" for="ks-o">O - Organization</label>
          <input class="ks-input" type="text" id="ks-o" name="ksO" placeholder="e.g. Acme Corp" />

          <label class="ks-label" for="ks-l">L - City</label>
          <input class="ks-input" type="text" id="ks-l" name="ksL" placeholder="e.g. New York" />

          <label class="ks-label" for="ks-st">ST - State</label>
          <input class="ks-input" type="text" id="ks-st" name="ksSt" placeholder="e.g. California" />

          <label class="ks-label" for="ks-c">C - Country Code</label>
          <input class="ks-input" type="text" id="ks-c" name="ksC" placeholder="e.g. US" maxlength="2" />
        </fieldset>

        <button class="ks-submit" type="submit" id="generate-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Generate KeyStore
        </button>
      </form>

      <div id="output-area" class="ks-output" aria-live="polite"></div>
    </main>

    <dialog id="error-dialog" class="error-dialog" aria-labelledby="error-title">
      <div class="dialog-mark" aria-hidden="true">!</div>
      <h2 id="error-title">Error</h2>
      <p id="error-msg">An unexpected error occurred.</p>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
